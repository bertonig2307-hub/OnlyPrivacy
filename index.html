<script>
// Registra il service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('✅ Service Worker registrato'))
      .catch(err => console.log('❌ Errore SW:', err));
  });
}

// Cattura l'evento di installazione per usare un bottone personalizzato
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const installBtn = document.getElementById('install-btn');
  if (installBtn) installBtn.style.display = 'inline-flex';
});

function installApp() {
  if (!deferredPrompt) {
    // iOS o browser che non supportano l'install automatico
    showIOSInstructions();
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then((choice) => {
    if (choice.outcome === 'accepted') {
      console.log('🎉 App installata!');
      toast('🎉 CyberEroi installata con successo!');
    }
    deferredPrompt = null;
    document.getElementById('install-btn').style.display = 'none';
  });
}

// Rileva iOS (Safari non supporta beforeinstallprompt)
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function showIOSInstructions() {
  alert('📱 Per installare su iPhone/iPad:\n\n1. Tocca il tasto Condividi (⬆️) in basso\n2. Scorri e scegli "Aggiungi alla schermata Home"\n3. Conferma!');
}

// Nascondi il bottone se l'app è già installata
window.addEventListener('appinstalled', () => {
  const installBtn = document.getElementById('install-btn');
  if (installBtn) installBtn.style.display = 'none';
});

// Se è già in modalità standalone (già installata), nascondi bottone
if (window.matchMedia('(display-mode: standalone)').matches) {
  document.addEventListener('DOMContentLoaded', () => {
    const installBtn = document.getElementById('install-btn');
    if (installBtn) installBtn.style.display = 'none';
  });
}
</script>

/* =========================================================
   UTILITY
========================================================= */
function toast(msg){
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.classList.add('show'),50);
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),400);},3000);
}
function addPoints(n){
  const oldLevel=getLevel(state.points);
  state.points+=n; saveState();
  toast(`✨ +${n} punti!`);
  const newLevel=getLevel(state.points);
  if(newLevel>oldLevel) setTimeout(()=>toast(`🎉 Livello ${newLevel} raggiunto!`),700);
  renderHeader();
}
function checkTrophies(){
  TROPHIES.forEach(t=>{
    if(!state.trophies.includes(t.id) && t.cond(state)){
      state.trophies.push(t.id); saveState();
      toast(`🏆 Nuovo trofeo: ${t.title}!`);
    }
  });
}
function updateStreak(){
  const today=new Date().toDateString();
  if(state.streak.lastDate===today) return;
  const yesterday=new Date(Date.now()-86400000).toDateString();
  state.streak.count = (state.streak.lastDate===yesterday)? state.streak.count+1 : 1;
  state.streak.lastDate=today;
  addPoints(5);
  saveState();
}
function speak(text){
  if(!window.speechSynthesis){ alert('Lettura vocale non supportata su questo dispositivo'); return; }
  const clean = text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='it-IT'; u.rate=0.95;
  speechSynthesis.speak(u);
}
function resetProgress(){
  if(confirm('Sei sicuro di voler cancellare tutti i tuoi progressi?')){
    localStorage.removeItem('cyberEroiState'); location.reload();
  }
}

function renderLessons(){
  const el=document.getElementById('view-lessons');
  if(!currentLessonId){
    let html = `<h2>📚 Lezioni Veloci</h2><p class="subtitle">Solo 3 minuti per diventare più furbo del pericolo!</p><div class="grid">`;
    LESSONS.forEach((l,i)=>{
      const done = state.lessonsCompleted.includes(l.id);
      const locked = i>0 && !state.lessonsCompleted.includes(LESSONS[i-1].id);
      html += `<div class="card lesson-card ${locked?'locked':''}" style="--accent:${l.color}" onclick="openLesson('${l.id}')">
        <div class="card-icon">${locked?'🔒':l.icon}</div>
        <h3>${l.title}</h3>
        <p>${locked?'Completa la lezione precedente':(done?'✅ Completata':'Nuova lezione')}</p>
      </div>`;
    });
    html += `</div>`;
    el.innerHTML = html;
  } else {
    const l = LESSONS.find(x=>x.id===currentLessonId);
    let html = `<button class="btn btn-back" onclick="currentLessonId=null;render()">⬅ Torna alle lezioni</button>
    <div class="lesson-detail" style="--accent:${l.color}">
    <h2>${l.icon} ${l.title}</h2>
    <button class="btn btn-speak" onclick="speakLesson('${l.id}')">🔊 Ascolta la lezione</button>
    <div class="comic-box">${l.content.map(p=>`<div class="comic-bubble">${p}</div>`).join('')}</div>`;
    if(!state.lessonsCompleted.includes(l.id)){
      html += renderLessonQuiz(l);
    } else {
      html += `<div class="success-box">✅ Hai già completato questa lezione!</div>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  }
}
function openLesson(id){
  const idx = LESSONS.findIndex(l=>l.id===id);
  if(idx>0 && !state.lessonsCompleted.includes(LESSONS[idx-1].id)) return;
  currentLessonId=id; lessonAnswers={}; render();
}
function speakLesson(id){ const l=LESSONS.find(x=>x.id===id); speak(l.content.join('. ')); }
function renderLessonQuiz(l){
  let html = `<div class="quiz-box"><h3>📝 Metti alla prova quello che hai imparato!</h3>`;
  l.quiz.forEach((q,qi)=>{
    html += `<div class="quiz-question"><p><strong>${qi+1}. ${q.q}</strong></p>`;
    q.options.forEach((opt,oi)=>{
      html += `<label class="quiz-option"><input type="radio" name="q${qi}" value="${oi}" onchange="setLessonAnswer(${qi},${oi})"> ${opt}</label>`;
    });
    html += `</div>`;
  });
  html += `<button class="btn btn-primary" onclick="submitLessonQuiz('${l.id}')">Invia risposte ✅</button><div id="quiz-feedback"></div></div>`;
  return html;
}
function setLessonAnswer(qi,oi){ lessonAnswers[qi]=oi; }
function submitLessonQuiz(lessonId){
  const l = LESSONS.find(x=>x.id===lessonId);
  let correct=0;
  l.quiz.forEach((q,qi)=>{ if(lessonAnswers[qi]===q.correct) correct++; });
  const fb=document.getElementById('quiz-feedback');
  if(correct===l.quiz.length){
    fb.innerHTML = `<div class="success-box">🎉 Perfetto! Tutte le risposte corrette! +30 punti.</div>`;
    if(!state.lessonsCompleted.includes(lessonId)){
      state.lessonsCompleted.push(lessonId); addPoints(30); saveState(); checkTrophies();
    }
    setTimeout(()=>{ currentLessonId=null; render(); },1800);
  } else {
    fb.innerHTML = `<div class="error-box">Hai risposto correttamente a ${correct} su ${l.quiz.length} domande. Riprova! 💪</div>`;
  }
}

function renderTruffaGame(){
  const c=document.getElementById('game-container');
  if(truffaIndex>=TRUFFA_MESSAGES.length){
    c.innerHTML = `<div class="result-box"><h2>🎉 Gioco completato!</h2><p>Hai indovinato ${truffaScore} su ${TRUFFA_MESSAGES.length} messaggi!</p>
    <button class="btn btn-primary" onclick="finishGame('truffa')">Riscuoti punti 🏆</button></div>`;
    return;
  }
  const m=TRUFFA_MESSAGES[truffaIndex];
  c.innerHTML = `<div class="phone-mock">
    <div class="chat-header">${m.avatar} ${m.from}</div>
    <div class="chat-bubble">${m.text}</div>
  </div>
  <div class="choice-row">
    <button class="btn btn-safe" onclick="answerTruffa(false)">✅ È vero</button>
    <button class="btn btn-danger" onclick="answerTruffa(true)">🚨 È una truffa</button>
  </div>
  <div id="truffa-feedback"></div>
  <p class="progress-text">Messaggio ${truffaIndex+1} di ${TRUFFA_MESSAGES.length}</p>`;
}
function answerTruffa(guess){
  const m=TRUFFA_MESSAGES[truffaIndex];
  const correct = guess===m.isScam;
  if(correct) truffaScore++;
  document.getElementById('truffa-feedback').innerHTML = `<div class="${correct?'success-box':'error-box'}">${correct?'✅ Esatto!':'❌ Sbagliato!'} ${m.explanation}</div>`;
  document.querySelectorAll('.choice-row button').forEach(b=>b.disabled=true);
  setTimeout(()=>{ truffaIndex++; renderTruffaGame(); },2200);
}

/* --- Testa Password --- */
const COMMON_PW=['123456','password','123456789','12345678','12345','1234567','qwerty','abc123','111111','123123','ciao123','password1','admin','iloveyou','000000','calcio','1234','welcome'];
function analyzePassword(pw){
  const lower=pw.toLowerCase();
  if(COMMON_PW.includes(lower)){
    return {score:0, time:'2 secondi', label:'Pericolosissima!', color:'#ff4757', tips:['Questa è tra le password più usate al mondo! Un hacker la indovina all\'istante.']};
  }
  let score=0; const tips=[];
  if(pw.length>=12) score+=2; else if(pw.length>=8) score+=1; else tips.push('Usa almeno 8 caratteri, meglio 12+');
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw)) score+=1; else tips.push('Mescola lettere maiuscole e minuscole');
  if(/[0-9]/.test(pw)) score+=1; else tips.push('Aggiungi qualche numero');
  if(/[^A-Za-z0-9]/.test(pw)) score+=1; else tips.push('Aggiungi un simbolo speciale (!,@,#...)');
  const levels=[
    {max:1,time:'pochi secondi',label:'Debolissima',color:'#ff4757'},
    {max:2,time:'qualche minuto',label:'Debole',color:'#ffa502'},
    {max:3,time:'qualche giorno',label:'Discreta',color:'#f1c40f'},
    {max:4,time:'qualche mese',label:'Buona',color:'#2ed573'},
    {max:5,time:'centinaia di anni',label:'Sicurissima!',color:'#1abc9c'}
  ];
  const lvl = levels.find(l=>score<=l.max) || levels[levels.length-1];
  return {score, time:lvl.time, label:lvl.label, color:lvl.color, tips};
}
function renderPasswordGame(){
  document.getElementById('game-container').innerHTML = `<h2>🔐 Testa-Password</h2><p>Scrivi una password (anche finta, non usare quella vera!) e scopri quanto è sicura.</p>
  <input type="text" id="pwInput" class="pw-input" placeholder="Scrivi qui..." oninput="checkPwLive()">
  <div id="pw-result"></div>`;
}
function checkPwLive(){
  const pw=document.getElementById('pwInput').value;
  const res=document.getElementById('pw-result');
  if(!pw){ res.innerHTML=''; return; }
  const a=analyzePassword(pw);
  res.innerHTML = `<div class="meter"><div class="meter-fill" style="width:${a.score*20}%;background:${a.color}"></div></div>
  <p style="color:${a.color};font-weight:bold">${a.label} — un hacker ci metterebbe circa ${a.time}!</p>
  ${a.tips.length?`<ul>${a.tips.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}`;
  if(a.label==='Sicurissima!' && !state.flags.passwordTested){
    state.flags.passwordTested=true; state.flags.passwordPro=true;
    if(!state.gamesCompleted.includes('password')) state.gamesCompleted.push('password');
    saveState(); addPoints(30); checkTrophies(); renderHeader();
    res.innerHTML += `<div class="success-box">🎉 +30 punti per aver creato una password sicura!</div>`;
  }
}

/* --- Escape Room --- */
function renderEscapeGame(){
  const c=document.getElementById('game-container');
  if(escapeLives<=0){
    c.innerHTML = `<div class="result-box"><h2>💀 Game Over</h2><p>L'hacker ha preso il controllo! Ma puoi riprovare.</p>
    <button class="btn btn-primary" onclick="escapeIndex=0;escapeLives=3;renderEscapeGame()">Riprova 🔁</button></div>`;
    return;
  }
  if(escapeIndex>=ESCAPE_QUESTIONS.length){
    c.innerHTML = `<div class="result-box"><h2>🗝️ Sei riuscito/a a fuggire! Profilo salvato!</h2><p>Hai dimostrato di saperti difendere online.</p>
    <button class="btn btn-primary" onclick="finishGame('escape')">Riscuoti punti 🏆</button></div>`;
    return;
  }
  const q=ESCAPE_QUESTIONS[escapeIndex];
  c.innerHTML = `<div class="escape-header"><span>🚪 Porta ${escapeIndex+1}/${ESCAPE_QUESTIONS.length}</span><span>${'❤️'.repeat(escapeLives)}</span></div>
  <div class="escape-question"><p><strong>${q.q}</strong></p>
  ${q.options.map((o,i)=>`<button class="btn btn-option" onclick="answerEscape(${i})">${o}</button>`).join('')}
  </div><div id="escape-feedback"></div>`;
}
function answerEscape(i){
  const q=ESCAPE_QUESTIONS[escapeIndex];
  if(i===q.correct){
    document.getElementById('escape-feedback').innerHTML = `<div class="success-box">✅ Porta aperta!</div>`;
    setTimeout(()=>{ escapeIndex++; renderEscapeGame(); },1100);
  } else {
    escapeLives--;
    document.getElementById('escape-feedback').innerHTML = `<div class="error-box">❌ Risposta sbagliata! Hai perso una vita.</div>`;
    setTimeout(()=>renderEscapeGame(),1100);
  }
}

/* --- Finto Profilo --- */
function renderProfiloGame(){
  document.getElementById('game-container').innerHTML = `<h2>🙈 Trova gli errori di Privacy</h2><p>Clicca su tutti gli elementi del profilo che NON dovrebbero essere pubblici!</p>
  <div class="profile-mock">${PROFILE_FIELDS.map(f=>`<div class="profile-field ${profiloSelected.has(f.id)?'selected':''}" onclick="toggleProfileField('${f.id}')">${f.label}</div>`).join('')}</div>
  <button class="btn btn-primary" onclick="submitProfileGame()">Controlla risposte ✅</button>
  <div id="profilo-feedback"></div>`;
}
function toggleProfileField(id){
  if(profiloSelected.has(id)) profiloSelected.delete(id); else profiloSelected.add(id);
  renderProfiloGame();
}
function submitProfileGame(){
  let correct=0, wrong=0;
  const errors = PROFILE_FIELDS.filter(f=>f.isError);
  PROFILE_FIELDS.forEach(f=>{
    if(f.isError && profiloSelected.has(f.id)) correct++;
    if(!f.isError && profiloSelected.has(f.id)) wrong++;
  });
  const explanations = errors.map(f=>`<li>${f.label} → ${f.why}</li>`).join('');
  document.getElementById('profilo-feedback').innerHTML = `
  <div class="${(correct===errors.length && wrong===0)?'success-box':'error-box'}">Hai trovato ${correct} errori su ${errors.length} (${wrong} scelte sbagliate).</div>
  <p><strong>Spiegazioni:</strong></p><ul>${explanations}</ul>
  <button class="btn btn-primary" onclick="finishGame('profilo')">Riscuoti punti 🏆</button>`;
}

/* =========================================================
   STORIE
========================================================= */
function renderStories(){
  const el=document.getElementById('view-stories');
  if(!currentStory){
    el.innerHTML = `<h2>📖 Storie Interattive</h2><p class="subtitle">Scegli, scopri cosa succede!</p>
    <div class="grid">${STORIES.map(s=>`<div class="card story-card" onclick="openStory('${s.id}')"><div class="card-icon">${s.icon}</div><h3>${s.title}</h3><p>${s.desc}</p>${state.storiesCompleted.includes(s.id)?'<p>✅ Completata</p>':''}</div>`).join('')}</div>`;
  } else {
    const story=STORIES.find(s=>s.id===currentStory);
    const node=story.nodes[currentNode];
    let html = `<button class="btn btn-back" onclick="currentStory=null;render()">⬅ Torna alle storie</button>
    <div class="story-box"><h2>${story.icon} ${story.title}</h2>
    <button class="btn btn-speak" onclick="speakCurrentStoryNode()">🔊 Ascolta</button>
    <p class="story-text">${node.text}</p>`;
    if(node.end){
      html += `<div class="${node.end==='good'?'success-box':'error-box'}"><strong>${node.end==='good'?'🎉 Ottima scelta!':'⚠️ Attenzione!'}</strong><p>${node.result}</p></div>
      <button class="btn btn-primary" onclick="finishStory('${story.id}',${node.points})">Continua (+${node.points} punti) 🏆</button>`;
    } else {
      html += `<div class="choice-row-col">${node.choices.map(ch=>`<button class="btn btn-option" onclick="goToNode('${ch.next}')">${ch.label}</button>`).join('')}</div>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  }
}
function openStory(id){ currentStory=id; currentNode='start'; render(); }
function goToNode(next){ currentNode=next; render(); }
function speakCurrentStoryNode(){ const story=STORIES.find(s=>s.id===currentStory); speak(story.nodes[currentNode].text); }
function finishStory(id, points){
  if(!state.storiesCompleted.includes(id)){
    state.storiesCompleted.push(id); addPoints(points); saveState(); checkTrophies();
  } else { addPoints(5); }
  currentStory=null; render();
}

function renderCertificate(){
  const lessonsDone=state.lessonsCompleted.length;
  const gamesDone=state.gamesCompleted.length;
  const eligible = lessonsDone>=LESSONS.length && gamesDone>=4;
  let html = `<h2>🎓 Patentino di Sicurezza Digitale</h2>`;
  if(!eligible){
    html += `<p class="subtitle">Completa tutto il percorso per ottenere il tuo patentino ufficiale!</p>
    <div class="progress-item"><span>📚 Lezioni: ${lessonsDone}/${LESSONS.length}</span><div class="progress-bar"><div class="progress-fill" style="width:${lessonsDone/LESSONS.length*100}%"></div></div></div>
    <div class="progress-item"><span>🧪 Prove pratiche: ${gamesDone}/4</span><div class="progress-bar"><div class="progress-fill" style="width:${gamesDone/4*100}%"></div></div></div>`;
  } else {
    html += `<div class="success-box">🎉 Complimenti! Hai completato tutto il percorso. Scarica il tuo patentino!</div>
    <input type="text" id="certName" class="pw-input" placeholder="Il tuo nome" value="${esc(state.name||'')}">
    <button class="btn btn-primary" onclick="downloadCertificate()">📥 Genera e Scarica Patentino</button>`;
  }
  document.getElementById('view-certificate').innerHTML = html;
}
function downloadCertificate(){
  const name = document.getElementById('certName').value || 'Eroe Digitale';
  state.name=name; saveState(); renderHeader();
  generateCertificate(name);
  checkTrophies();
}
function generateCertificate(name){
  const canvas=document.createElement('canvas');
  canvas.width=1000; canvas.height=700;
  const ctx=canvas.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,1000,700);
  grad.addColorStop(0,'#667eea'); grad.addColorStop(1,'#764ba2');
  ctx.fillStyle=grad; ctx.fillRect(0,0,1000,700);
  ctx.fillStyle='#fff'; ctx.fillRect(30,30,940,640);
  ctx.strokeStyle='#764ba2'; ctx.lineWidth=6; ctx.strokeRect(45,45,910,610);
  ctx.textAlign='center';
  ctx.fillStyle='#333'; ctx.font='bold 28px Arial'; ctx.fillText('🛡️ OnlyPrivacy 🛡️',500,120);
  ctx.fillStyle='#764ba2'; ctx.font='bold 42px Arial'; ctx.fillText('PATENTINO DI SICUREZZA DIGITALE',500,190);
  ctx.fillStyle='#555'; ctx.font='22px Arial'; ctx.fillText('Si certifica che',500,260);
  ctx.fillStyle='#222'; ctx.font='bold 52px Arial'; ctx.fillText(name,500,330);
  ctx.fillStyle='#555'; ctx.font='21px Arial';
  ctx.fillText('ha completato con successo il percorso di educazione',500,390);
  ctx.fillText('alla sicurezza informatica, dimostrando di saper',500,420);
  ctx.fillText('riconoscere i pericoli del web e proteggersi online.',500,450);
  ctx.fillStyle='#764ba2'; ctx.font='bold 24px Arial';
  ctx.fillText('Livello raggiunto: '+getLevel(state.points)+'   •   Punti: '+state.points,500,510);
  ctx.fillStyle='#888'; ctx.font='18px Arial';
  ctx.fillText('Data: '+new Date().toLocaleDateString('it-IT'),500,570);
  ctx.font='60px Arial'; ctx.fillText('🏆',500,650);
  const link=document.createElement('a');
  link.download='patentino_cybereroi.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}
